const getWeekNumber = (d) => {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
};

function getColor(val) {

  if (isNaN(v)) return "#bfdbfe";
  if (v < 2.0) return "#ef4444";

  if (v < 3.0) return "#facc15";
  if (v < 4.0) return "#4ade80";
  return "#0284c7";
}

// ── Voice helpers (parser) ───────────────────────────────────────────────────

const SWEDISH_NUMS = {
  // Svenska grundformer
  "noll": "0", "en": "1", "ett": "1", "tva": "2", "två": "2", "tre": "3", "fyra": "4",
  "fem": "5", "sex": "6", "sju": "7", "atta": "8", "åtta": "8", "nio": "9",
  // Svenska bestämda former (sjuan, åttan, fyran...)
  "nollan": "0", "ettan": "1", "tvaan": "2", "tvåan": "2", "trean": "3",
  "fyran": "4", "femman": "5", "sexan": "6", "sjuan": "7",
  "attan": "8", "åttan": "8", "nian": "9",
  // Engelska
  "zero": "0", "one": "1", "two": "2", "three": "3", "four": "4",
  "five": "5", "six": "6", "seven": "7", "eight": "8", "nine": "9",
  // Vanliga Whisper-feltolkningar
  "shoe": "7", "sho": "7", "cho": "7", "jo": "7", "show": "7", "shoo": "7", "sjoo": "7",
  "cool": "7", "ku": "7", "kool": "7",
  "otto": "8", "otta": "8", "otha": "8", "auta": "8", "eta": "8", "ata": "8", "otan": "8",
  "twa": "2", "tvah": "2", "fira": "4", "fura": "4", "vera": "4", "seya": "4", "seeya": "4",
};
const DECIMAL_WORDS = ["komma", "punkt", "och", "point"];

const PHRASE_MAP = [
  [/see\s+ya/g,    "4"],
  [/c\s+ya/g,      "4"],
  [/see\s+you/g,   "4"],
  [/oh[,\s]+that/g, "8"],
  [/oh\s+da/g,     "8"],
];

function parseVoiceInput(raw) {
  let s = raw.toLowerCase().trim();
  // Fras-ersättningar (multi-ord) före ordmatchning
  PHRASE_MAP.forEach(([re, digit]) => { s = s.replace(re, digit); });
  DECIMAL_WORDS.forEach(w => { s = s.replace(new RegExp("\\b" + w + "\\b", "g"), "."); });
  Object.entries(SWEDISH_NUMS).forEach(([word, digit]) => {
    s = s.replace(new RegExp("\\b" + word + "\\b", "g"), digit);
  });
  s = s.replace(/[,\/]/g, ".");
  s = s.replace(/(\d)\s*\.\s*(\d)/g, "$1.$2");
  s = s.replace(/(\d)\s+(\d)/g, "$1.$2");
  const clean = s.replace(/[^\d.]/g, "");
  const match = clean.match(/\d+\.?\d*/);
  if (!match) return null;
  const num = parseFloat(match[0]);
  if (isNaN(num) || num < 0 || num > 9.9) return null;
  return String(Math.round(num * 10) / 10);
}

// ── Whisper offline (lazy-loaded fallback) ───────────────────────────────────

let whisperPipeline = null;
let whisperState = "idle"; // "idle" | "loading" | "ready" | "error"
let whisperCallbacks = [];

async function loadWhisper(onProgress) {
  if (whisperState === "ready") return whisperPipeline;
  if (whisperState === "loading") return new Promise((res, rej) => whisperCallbacks.push({ res, rej }));
  whisperState = "loading";
  try {
    await new Promise(resolve => {
      if (window._transformersReady) { resolve(); return; }
      window.addEventListener("transformers-ready", resolve, { once: true });
      setTimeout(resolve, 30000);
    });
    const pipeline = window._transformersPipeline;
    if (!pipeline) throw new Error("transformers.js laddades inte");
    whisperPipeline = await pipeline("automatic-speech-recognition", "onnx-community/whisper-base", {
      progress_callback: onProgress,
    });
    whisperState = "ready";
    whisperCallbacks.forEach(c => c.res(whisperPipeline));
  } catch(e) {
    whisperState = "error";
    whisperCallbacks.forEach(c => c.rej(e));
    throw e;
  } finally { whisperCallbacks = []; }
  return whisperPipeline;
}

function recordAudio(onStop) {
  return navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    const chunks = [];
    const mr = new MediaRecorder(stream);
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      onStop(new Blob(chunks, { type: "audio/webm" }));
    };
    mr.start();
    return mr;
  });
}

async function blobToFloat32(blob) {
  const arrayBuffer = await blob.arrayBuffer();
  const audioCtx = new AudioContext({ sampleRate: 16000 });
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  audioCtx.close();
  return audioBuffer.getChannelData(0);
}

// ── Text-to-speech ───────────────────────────────────────────────────────────

function speakSwedish(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "sv-SE";
  u.rate = 1.0;
  // Try to find a Swedish voice, fall back to default
  const voices = window.speechSynthesis.getVoices();
  const svVoice = voices.find(v => v.lang.startsWith("sv"));
  if (svVoice) u.voice = svVoice;
  window.speechSynthesis.speak(u);
}

function valueToSwedish(val) {
  // Convert "3.5" → "tre komma fem"
  const nums = ["noll","ett","två","tre","fyra","fem","sex","sju","åtta","nio"];
  const parts = String(val).split(".");
  const hel = parseInt(parts[0]);
  const dec = parts[1] ? parseInt(parts[1]) : null;
  let s = nums[hel] !== undefined ? nums[hel] : val;
  if (dec !== null) s += " komma " + (nums[dec] !== undefined ? nums[dec] : dec);
  return s;
}

function pointToSwedish(pointId) {
  // "I4" → "I fyra", "S12" → "S tolv"
  const nums = ["noll","ett","två","tre","fyra","fem","sex","sju","åtta","nio"];
  const prefix = pointId[0]; // "I" or "S"
  const num = parseInt(pointId.slice(1));
  let spoken;
  if (num <= 9) spoken = nums[num];
  else if (num === 10) spoken = "tio";
  else if (num === 11) spoken = "elva";
  else if (num === 12) spoken = "tolv";
  else if (num === 13) spoken = "tretton";
  else if (num === 14) spoken = "fjorton";
  else if (num === 15) spoken = "femton";
  else if (num === 16) spoken = "sexton";
  else spoken = String(num);
  return prefix + " " + spoken;
}

// ── MicButton ─────────────────────────────────────────────────────────────────

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function MicButton({ onResult, selectedPoint }) {
  // Web Speech först överallt (även mobil) — Whisper laddas bara om den fallerar
  const [mode, setMode] = useState(SpeechRecognition ? "web" : "whisper");
  const [status, setStatus] = useState("ready");
  const [loadProgress, setLoadProgress] = useState(0);
  const [whisperReady, setWhisperReady] = useState(whisperState === "ready");
  const [lastHeard, setLastHeard] = useState("");
  const [listening, setListening] = useState(false);
  const recognitionRef = useRef(null);
  const recorderRef = useRef(null);

  // Bara om Web Speech helt saknas i webbläsaren — ladda Whisper direkt
  useEffect(() => {
    if (!SpeechRecognition) triggerWhisperLoad();
  }, []);

  const triggerWhisperLoad = () => {
    if (whisperState === "ready") { setWhisperReady(true); setStatus("ready"); return; }
    setStatus("loading");
    setLoadProgress(0);
    loadWhisper(p => {
      if (p.status === "progress" && p.total)
        setLoadProgress(Math.round((p.loaded / p.total) * 100));
    }).then(() => {
      setWhisperReady(true);
      setStatus("ready");
    }).catch(e => {
      whisperState = "idle"; // släpp låset så knappen kan försöka igen
      setLastHeard("Röstmodell: " + (e && e.message ? e.message : "okänt fel"));
      setStatus("loaderror");
    });
  };

  // ── Web Speech ──────────────────────────────────────────────────────────────
  const startWebSpeech = () => {
    const rec = new SpeechRecognition();
    rec.lang = "sv-SE";
    rec.continuous = false;
    rec.interimResults = true; // Android: sista interim-texten räddar oss om final aldrig kommer
    rec.maxAlternatives = 3;
    let gotResult = false;
    let lastInterim = "";

    // Tolka alternativen, plocka det första som ger en giltig siffra
    const finish = (alternatives) => {
      gotResult = true;
      let transcript = "", val = null;
      for (let i = 0; i < alternatives.length; i++) {
        const alt = alternatives[i];
        val = parseVoiceInput(alt);
        if (val !== null) { transcript = alt; break; }
        if (!transcript) transcript = alt;
      }
      setLastHeard(transcript);
      if (val !== null) { setStatus("ok"); onResult(val); setTimeout(() => setStatus("ready"), 1500); }
      else { setStatus("error"); setTimeout(() => setStatus("ready"), 2000); }
    };

    rec.onresult = (event) => {
      const res = event.results[event.results.length - 1];
      if (!res.isFinal) { lastInterim = res[0].transcript; return; }
      const alts = [];
      for (let i = 0; i < res.length; i++) alts.push(res[i].transcript);
      finish(alts);
    };

    rec.onerror = (e) => {
      gotResult = true; // prevent onend from double-erroring
      setListening(false);
      if (e.error === "network") {
        setLastHeard("Inget nätverk — laddar offline-läge…");
        setMode("whisper");
        triggerWhisperLoad();
      } else if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        setLastHeard("Mikrofonåtkomst nekad — tillåt mikrofon i webbläsaren");
        setStatus("error");
        setTimeout(() => setStatus("ready"), 4000);
      } else {
        setLastHeard(`Fel: ${e.error} — försök igen`);
        setStatus("error");
        setTimeout(() => setStatus("ready"), 2500);
      }
    };

    rec.onend = () => {
      setListening(false);
      if (gotResult) return;
      // Android: final-resultatet kan komma strax efter onend — eller aldrig
      setTimeout(() => {
        if (gotResult) return;
        if (lastInterim) { finish([lastInterim]); return; } // använd det vi hann höra
        setStatus("error");
        setLastHeard("Ingen röst uppfångad — försök igen");
        setTimeout(() => setStatus("ready"), 2000);
      }, 1200);
    };

    try {
      rec.start();
      recognitionRef.current = rec;
      setListening(true);
      setStatus("listening");
    } catch(e) {
      // Web Speech finns men går inte att starta — fall tillbaka på offline-läge
      setLastHeard(`Startfel: ${e.message} — byter till offline-läge…`);
      setMode("whisper");
      triggerWhisperLoad();
    }
  };

  // ── Whisper ─────────────────────────────────────────────────────────────────
  const startWhisper = async () => {
    try {
      const mr = await recordAudio((blob) => {
        setStatus("processing");
        blobToFloat32(blob).then(audio =>
          whisperPipeline(audio, { task: "transcribe" })
        ).then(result => {
          const transcript = result.text || "";
          setLastHeard(transcript);
          const val = parseVoiceInput(transcript);
          if (val !== null) { setStatus("ok"); onResult(val); setTimeout(() => setStatus("ready"), 1500); }
          else { setStatus("error"); setTimeout(() => setStatus("ready"), 2000); }
        }).catch(e => {
          setLastHeard("FEL: " + e.message);
          setStatus("error");
          setTimeout(() => setStatus("ready"), 2000);
        });
      });
      recorderRef.current = mr;
      setListening(true);
      setStatus("listening");
    } catch(e) {
      setLastHeard("Mikrofonfel: " + e.message);
      setStatus("error");
      setTimeout(() => setStatus("ready"), 2000);
    }
  };

  const toggle = () => {
    if (listening) {
      if (mode === "web" && recognitionRef.current) recognitionRef.current.stop();
      if (mode === "whisper" && recorderRef.current) recorderRef.current.stop();
      setListening(false);
    } else {
      if (mode === "web") startWebSpeech();
      else if (whisperReady) startWhisper();
      else triggerWhisperLoad(); // ladda modellen / försök igen efter misslyckad laddning
    }
  };

  const isLoading = status === "loading";
  const isProcessing = status === "processing";
  const isDisabled = isLoading || isProcessing;

  const isError = status === "error" || status === "loaderror";

  const bgColor = status === "ok" ? "#14532d" : isError ? "#450a0a" : listening ? "#dbeafe" : "#e8f0fb";
  const borderColor = status === "ok" ? "#4ade80" : isError ? "#ef4444" : listening ? "#0284c7" : status === "ready" ? "#3b82f6" : "#93c5fd";
  const textColor = listening ? "#0284c7" : status === "ok" ? "#4ade80" : isError ? "#ef4444" : status === "ready" ? "#1d4ed8" : "#475569";
  const label = isLoading ? `Laddar röstmodell… ${loadProgress}%`
    : status === "ready" ? "🎤 Tryck och tala"
    : status === "listening" ? "⏹ Klar (tryck för att stoppa)"
    : isProcessing ? "Bearbetar…"
    : status === "ok" ? "✓ OK"
    : status === "loaderror" ? "⚠ Röstmodell kunde inte laddas — tryck för att försöka igen"
    : status === "error" ? "Hörde ej — försök igen"
    : "…";

  return (
    <div style={{ marginBottom: "16px" }}>
      {isLoading && (
        <div style={{ background: "#e8f0fb", borderRadius: "4px", marginBottom: "6px", height: "4px", overflow: "hidden" }}>
          <div style={{ height: "100%", width: loadProgress + "%", background: "#0284c7", borderRadius: "4px", transition: "width 0.3s" }} />
        </div>
      )}
      <button onClick={toggle} disabled={isDisabled}
        style={{
          width: "100%", padding: "12px",
          background: bgColor, border: `1px solid ${borderColor}`, borderRadius: "10px",
          color: textColor, fontSize: "14px", fontWeight: "600",
          cursor: isDisabled ? "wait" : "pointer",
          transition: "all 0.15s", display: "flex", alignItems: "center", justifyContent: "center", gap: "8px",
        }}>
        {listening && <span style={{ display: "inline-block", width: "8px", height: "8px", borderRadius: "50%", background: "#0284c7", animation: "pulse 0.8s infinite" }} />}
        {isProcessing && <span style={{ display: "inline-block", width: "8px", height: "8px", borderRadius: "50%", background: "#facc15", animation: "pulse 0.5s infinite" }} />}
        {label}
      </button>
      {mode === "whisper" && whisperReady && (
        <div style={{ fontSize: "10px", color: "#4ade80", textAlign: "center", marginTop: "4px", opacity: 0.7 }}>
          Offline-läge aktivt
        </div>
      )}
      {selectedPoint && !isLoading && (
        <div style={{ fontSize: "11px", color: "#475569", textAlign: "center", marginTop: "5px" }}>
          Aktiv punkt: <span style={{ color: "#0284c7", fontFamily: "'DM Mono',monospace", fontWeight: "700" }}>{selectedPoint}</span>
          &nbsp;— tryck, tala, tryck igen
        </div>
      )}
      {!selectedPoint && status === "ready" && (
        <div style={{ fontSize: "11px", color: "#94a3b8", textAlign: "center", marginTop: "5px" }}>
          Välj en punkt på rinken eller i listan först
        </div>
      )}
      {lastHeard && (
        <div style={{ fontSize: "11px", color: "#475569", textAlign: "center", marginTop: "4px",
          background: "#e8f0fb", borderRadius: "4px", padding: "3px 8px", fontFamily: "'DM Mono',monospace" }}>
          Hörde: <span style={{ color: "#0f172a" }}>"{lastHeard}"</span>
        </div>
      )}
    </div>
  );
}

// ── SerialButton ──────────────────────────────────────────────────────────────

function SerialButton({ onResult, selectedPoint }) {
  const [status, setStatus] = useState("idle"); // idle | connecting | connected | error
  const [lastValue, setLastValue] = useState("");
  const disconnectRef = useRef(null);

  if (!("serial" in navigator)) return null;

  const connect = async () => {
    setStatus("connecting");
    try {
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      const reader = port.readable.getReader();
      let buffer = "";

      setStatus("connected");

      disconnectRef.current = async () => {
        try { await reader.cancel(); } catch {}
        try { await port.close(); } catch {}
        setStatus("idle");
        disconnectRef.current = null;
      };

      (async () => {
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += new TextDecoder().decode(value);
            const lines = buffer.split(/[\r\n]+/);
            buffer = lines.pop();
            for (const line of lines) {
              if (!line.trim()) continue;
              const num = parseFloat(line.replace(/[^\d.]/g, ""));
              if (!isNaN(num) && num > 0 && num < 15) {
                const val = String(Math.round(num * 10) / 10);
                setLastValue(val);
                onResult(val);
              }
            }
          }
        } catch (e) {
          if (e.name !== "AbortError") {
            setStatus("error");
            setTimeout(() => setStatus("idle"), 3000);
          }
        } finally {
          try { await port.close(); } catch {}
          setStatus(s => s !== "error" ? "idle" : s);
          disconnectRef.current = null;
        }
      })();

    } catch (e) {
      setStatus(e.name === "NotFoundError" ? "idle" : "error");
      if (e.name !== "NotFoundError") setTimeout(() => setStatus("idle"), 3000);
    }
  };

  const connected = status === "connected";
  const bgColor    = connected ? "#14532d" : status === "error" ? "#450a0a" : "#f8fafc";
  const borderColor= connected ? "#4ade80" : status === "error" ? "#ef4444" : "#d1ddf0";
  const textColor  = connected ? "#4ade80" : status === "error" ? "#ef4444" : "#475569";
  const label      = status === "connecting" ? "Ansluter…"

// ── Heatmap helpers ───────────────────────────────────────────────────────────

const COLOR_STOPS = [
  { v: 0,   r: 239, g: 68,  b: 68  },
  { v: 2.0, r: 239, g: 68,  b: 68  },
  { v: 2.5, r: 249, g: 115, b: 22  },
  { v: 3.0, r: 250, g: 204, b: 21  },
  { v: 4.0, r: 74,  g: 222, b: 128 },
  { v: 4.1, r: 2,   g: 132, b: 199 },
  { v: 9.9, r: 2,   g: 132, b: 199 },
];

function valueToRGB(v) {
  if (v <= COLOR_STOPS[0].v) return [COLOR_STOPS[0].r, COLOR_STOPS[0].g, COLOR_STOPS[0].b];
  const last = COLOR_STOPS[COLOR_STOPS.length - 1];
  if (v >= last.v) return [last.r, last.g, last.b];
  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    const a = COLOR_STOPS[i], b = COLOR_STOPS[i + 1];
    if (v >= a.v && v <= b.v) {
      const t = (v - a.v) / (b.v - a.v);
      return [
        Math.round(a.r + t * (b.r - a.r)),
        Math.round(a.g + t * (b.g - a.g)),
        Math.round(a.b + t * (b.b - a.b)),
      ];
    }
  }
  return [74, 222, 128];
}

const DELTA_STOPS = [
  { v: -2.0, r: 220, g: 38,  b: 38  },
  { v: -0.5, r: 252, g: 165, b: 165 },
  { v:  0,   r: 209, g: 213, b: 219 },
  { v:  0.5, r: 147, g: 197, b: 253 },
  { v:  2.0, r: 29,  g: 78,  b: 216 },
];

function deltaToRGB(v) {
  const stops = DELTA_STOPS;
  if (v <= stops[0].v) return [stops[0].r, stops[0].g, stops[0].b];
  const last = stops[stops.length - 1];
  if (v >= last.v) return [last.r, last.g, last.b];
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (v >= a.v && v <= b.v) {
      const t = (v - a.v) / (b.v - a.v);
      return [
        Math.round(a.r + t * (b.r - a.r)),
        Math.round(a.g + t * (b.g - a.g)),
        Math.round(a.b + t * (b.b - a.b)),
      ];
    }
  }
  return [209, 213, 219];
}

function getDeltaColor(delta) {
  if (delta === null || isNaN(delta)) return "#d1d5db";
  if (delta <= -1.5) return "#dc2626";
  if (delta <= -0.5) return "#ef4444";
  if (delta <  -0.1) return "#fca5a5";
  if (delta <   0.1) return "#d1d5db";
  if (delta <   0.5) return "#93c5fd";
  if (delta <   1.5) return "#3b82f6";
  return "#1d4ed8";
}

const HM_SCALE = 4;
const HM_W = Math.round(58 * HM_SCALE);
const HM_H = Math.round(96 * HM_SCALE);

function buildHeatmap(vals, deltaVals = null) {
  const isDelta = deltaVals !== null;
  const src = isDelta ? deltaVals : vals;
  const points = ALL_POINTS
    .filter(p => src[p.id] !== null && src[p.id] !== "" && !isNaN(parseFloat(src[p.id])))
    .map(p => ({
      x: (p.x - 2) * HM_SCALE,
      y: (p.y - 2) * HM_SCALE,
      v: parseFloat(src[p.id]),
    }));
  if (points.length < 2) return null;

  const canvas = document.createElement("canvas");
  canvas.width = HM_W;
  canvas.height = HM_H;
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(HM_W, HM_H);
  const d = img.data;

  for (let py = 0; py < HM_H; py++) {
    for (let px = 0; px < HM_W; px++) {
      let wSum = 0, vSum = 0;
      for (const p of points) {
        const dx = px - p.x, dy = py - p.y;
        const dist2 = dx * dx + dy * dy;
        if (dist2 < 1) { vSum = p.v; wSum = 1; break; }
        const w = 1 / dist2;
        wSum += w;
        vSum += w * p.v;
      }
      const [r, g, b] = isDelta ? deltaToRGB(vSum / wSum) : valueToRGB(vSum / wSum);
      const i = (py * HM_W + px) * 4;
      d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 200;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas.toDataURL();
}

function getAllSessions(weeks) {
  const sessions = [];
  weeks.forEach((w, wi) => {
    DAY_KEYS.forEach((key, di) => {
      const d = w[key];
      if (d && Object.values(d.values).some(v => v !== ""))
        sessions.push({ weekIdx: wi, dayKey: key, label: `v.${w.weekNum} ${DAYS[di]}` });
    });
  });
  return sessions;
}

function computeDeltas(fromData, toData) {
  const deltas = {};
  ALL_POINTS.forEach(p => {
    const f = parseFloat(fromData?.values?.[p.id]);
    const t = parseFloat(toData?.values?.[p.id]);
    deltas[p.id] = (!isNaN(f) && !isNaN(t)) ? Math.round((t - f) * 10) / 10 : null;
  });
  return deltas;
}

// Referenspunkten väljs ALLTID explicit (tryck "ref"). Aldrig automatiskt —
// annars blev den först ifyllda punkten referens och låstes till 0.
function resolveSlabRef(slab) {
  return (slab.ref && ALL_POINTS.some(p => p.id === slab.ref)) ? slab.ref : null;
}

const slabHasData = (slab) =>
  ALL_POINTS.some(p => slab.offsets[p.id] !== "" && !isNaN(parseFloat(slab.offsets[p.id])));

// Isytans höjd byggd från betongplattan: tjocklek + plattans offset (offset ≤ 0 = plattan lägre).
// Per punkt och fristående — inget dras från någon annan punkts istjocklek. En jämn isyta
// betyder att alla värden hamnar lika. Returneras som en dayData-liknande {values} så samma
// tjocklek-palett/legend som rink 1 kan återanvändas. Referenspunktens offset = 0.
function computeSurface(dayData, offsets, refId) {
  const vals = dayData?.values || {};
  const corrected = {};
  let any = false;
  ALL_POINTS.forEach(p => {
    const t = parseFloat(vals[p.id]);
    const off = p.id === refId ? 0 : parseFloat(offsets[p.id]);
    if (!isNaN(t) && !isNaN(off)) { corrected[p.id] = String(Math.round((t + off) * 10) / 10); any = true; }
    else corrected[p.id] = "";
  });
  return any ? { values: corrected } : null;
}

function DeltaPanel({ deltas, fromLabel, toLabel }) {
  const entries = ALL_POINTS.map(p => ({ ...p, delta: deltas[p.id] })).filter(p => p.delta !== null);
  if (entries.length === 0) return null;
  const vals = entries.map(p => p.delta);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const maxBuild = Math.max(...vals);
  const maxRemove = Math.min(...vals);
  const built = vals.filter(v => v > 0.1).length;
  const removed = vals.filter(v => v < -0.1).length;
  const unchanged = vals.length - built - removed;
  const maxBuildPt = entries.find(p => p.delta === maxBuild);
  const maxRemovePt = entries.find(p => p.delta === maxRemove);
  const avgColor = avg > 0.1 ? "#1d4ed8" : avg < -0.1 ? "#dc2626" : "#475569";

  return (
    <div style={{ background: "#ffffff", borderRadius: "12px", border: "1px solid #d1ddf0", padding: "14px", marginTop: "12px" }}>
      <div style={{ fontSize: "11px", color: "#475569", marginBottom: "10px", textTransform: "uppercase", letterSpacing: "1px" }}>
        {fromLabel} <span style={{ color: "#94a3b8" }}>→</span> {toLabel}
      </div>
      <div style={{ display: "flex", gap: "8px", marginBottom: "12px" }}>
        <Stat label="Snittförändring" value={(avg > 0 ? "+" : "") + avg.toFixed(2)} unit="cm" color={avgColor} />
        <Stat label="Mest bygge" value={"+" + maxBuild.toFixed(1)} unit={maxBuildPt?.label || ""} color="#1d4ed8" />
        <Stat label="Mest hyvling" value={maxRemove.toFixed(1)} unit={maxRemovePt?.label || ""} color="#dc2626" />
      </div>
      <div style={{ display: "flex", height: "8px", borderRadius: "4px", overflow: "hidden", marginBottom: "6px" }}>
        <div style={{ flex: removed || 0.01, background: "#ef4444" }} />
        <div style={{ flex: unchanged || 0.01, background: "#d1d5db" }} />
        <div style={{ flex: built || 0.01, background: "#3b82f6" }} />
      </div>
      <div style={{ display: "flex", gap: "12px", fontSize: "10px" }}>
        <span style={{ color: "#ef4444" }}>▼ {removed} nerhyvlade</span>
        <span style={{ color: "#94a3b8" }}>= {unchanged} oförändrade</span>
        <span style={{ color: "#3b82f6" }}>▲ {built} uppbyggda</span>
      </div>
    </div>
  );
}

function BarChart({ points, currentVals, prevVals, title }) {
  const n = points.length;
  const VW = 320, VH = 170;
  const padL = 24, padR = 6, padT = 8, padB = 20;
  const cW = VW - padL - padR;
  const cH = VH - padT - padB;

  const allVals = points.flatMap(p => [currentVals[p.id], prevVals[p.id]])
    .map(v => parseFloat(v)).filter(v => !isNaN(v) && v > 0);
  const yMax = allVals.length ? Math.ceil(Math.max(...allVals)) + 0.5 : 5;

  const slotW  = cW / n;
  const barW   = Math.max(3, slotW * 0.36);
  const toY    = v => padT + cH - (v / yMax) * cH;
  const toBH   = v => Math.max(0, (v / yMax) * cH);
  const yTicks = Array.from({ length: Math.ceil(yMax) + 1 }, (_, i) => i);

  return (

function WeekNav({ currentWeek, onNavigate }) {
  const [editing, setEditing] = useState(null); // null | "week" | "year"
  const [draft, setDraft] = useState("");

  if (!currentWeek) return null;
  const { weekNum, year } = currentWeek;

  const go = (num, yr) => {
    let w = num, y = yr;
    if (w < 1)  { y--; w = 52; }
    if (w > 52) { y++; w = 1; }
    onNavigate(w, y);
  };

  const commitWeek = () => {
    setEditing(null);
    const n = parseInt(draft);
    if (n >= 1 && n <= 52) go(n, year);
  };

  const commitYear = () => {
    setEditing(null);
    const y = parseInt(draft);
    if (y >= 2000 && y <= 2100) go(weekNum, y);
  };

  const inputStyle = (w) => ({
    width: w, textAlign: "center", fontFamily: "'DM Mono',monospace",
    fontSize: "12px", fontWeight: "700", color: "#1d4ed8",
    background: "#eff6ff", border: "1px solid #93c5fd", borderRadius: "4px",
    outline: "none", padding: "1px 2px",
  });

  const labelStyle = {
    fontSize: "12px", fontWeight: "700", color: "#1d4ed8", cursor: "pointer",
    borderBottom: "1px dashed #93c5fd", paddingBottom: "1px",
  };

  const btnStyle = {
    background: "none", border: "none", cursor: "pointer",
    color: "#1d4ed8", fontSize: "18px", fontWeight: "700",
    padding: "0 3px", lineHeight: 1, userSelect: "none",
  };

  return (
    <div style={{ display: "inline-flex", alignItems: "center", gap: "1px", marginLeft: "10px", fontFamily: "'DM Mono',monospace" }}>
      <button onClick={() => go(weekNum - 1, year)} style={btnStyle}>‹</button>
      {editing === "week" ? (
        <input autoFocus type="number" min="1" max="52" value={draft}
          onChange={e => setDraft(e.target.value)}
          onBlur={commitWeek}
          onKeyDown={e => { if (e.key === "Enter") commitWeek(); if (e.key === "Escape") setEditing(null); }}
          style={inputStyle("34px")} />
      ) : (
        <span onClick={() => { setDraft(String(weekNum)); setEditing("week"); }} title="Klicka för att byta vecka" style={labelStyle}>
          v.{weekNum}
        </span>
      )}
      <span style={{ color: "#94a3b8", margin: "0 2px", fontSize: "12px" }}> </span>
      {editing === "year" ? (
        <input autoFocus type="number" min="2000" max="2100" value={draft}
          onChange={e => setDraft(e.target.value)}
          onBlur={commitYear}
          onKeyDown={e => { if (e.key === "Enter") commitYear(); if (e.key === "Escape") setEditing(null); }}
          style={inputStyle("52px")} />
      ) : (
        <span onClick={() => { setDraft(String(year)); setEditing("year"); }} title="Klicka för att byta år" style={labelStyle}>
          {year}
        </span>
      )}
      <button onClick={() => go(weekNum + 1, year)} style={btnStyle}>›</button>
    </div>
  );
}

// Ersatte Cloudflare Worker + KV när Borrmall flyttade in i Sportrond. Skälet är
// inte bekvämlighet: den lösningen vilade på en delad hemlighet i klartext här i
// filen, och Sportronds repo publiceras av GitHub Pages — hemligheten hade blivit
// läsbar för vem som helst. Nu autentiseras varje användare som sig själv med
// sitt Nacka-konto, och det finns ingen hemlighet kvar att läcka.
//
// Kontraktet mot resten av appen är oförändrat: syncGet() ger { rev, updatedAt,
// data } och syncPut(data, baseRev) ger detsamma eller { conflict: true, ... }.
// Skillnaden är att rev nu är filens etag i stället för ett heltal — koden
// jämför bara likhet, aldrig ordning, så det spelar ingen roll.
const CLIENT_ID    = "adaf5794-4c0e-4901-847c-bce56968a30b";
const TENANT_ID    = "85f1def1-344e-41f0-b8fe-137f2800f31a";
const REDIRECT_URI = "https://nord0084.github.io/Sportrond/";
const SP_HOST      = "nacka.sharepoint.com";
const SP_SITE_PATH = "/sites/Idrottsdriften-verlmningarochprotokoll";
const GRAPH        = "https://graph.microsoft.com/v1.0";
const SCOPES       = ["https://graph.microsoft.com/Sites.ReadWrite.All"];
const DATAFIL      = "borrmall-data.json";   // i sitens dokumentbibliotek
const SYNC_ENABLED = true;
const POLL_MS = 15000;

const msalInstance = typeof msal !== "undefined" ? new msal.PublicClientApplication({
  auth:  { clientId: CLIENT_ID, authority: `https://login.microsoftonline.com/${TENANT_ID}`, redirectUri: REDIRECT_URI },
  cache: { cacheLocation: "sessionStorage" }
}) : null;

// Samma flik och samma origin som Sportrond ⇒ samma sessionStorage, alltså
// samma inloggning. Saknas konto loggar vi INTE in härifrån: redirect-URI:n är
// registrerad för Sportronds rot, så användaren hade landat där ändå. Bättre
// att säga det rakt ut än att kasta iväg någon utan förklaring.
const ärInloggad = () => !!(msalInstance && msalInstance.getAllAccounts().length);

async function getToken() {
  const account = msalInstance.getAllAccounts()[0];
  if (!account) throw new Error("not_logged_in");
  return (await msalInstance.acquireTokenSilent({ scopes: SCOPES, account })).accessToken;
}

async function gFetch(path, opts = {}) {
  const token = await getToken();
  const res = await fetch(path.startsWith("http") ? path : GRAPH + path, {
    ...opts,
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json", ...(opts.headers || {}) }
  });
  if (!res.ok) {
    const fel = new Error(`Graph ${res.status}`);
    fel.status = res.status;
    throw fel;
  }
  return res.status === 204 ? null : res.json();
}

// Site-id slås upp en gång och återanvänds. Promisen cachas, inte värdet, så
// parallella anrop under uppstarten inte gör var sin uppslagning.
let siteIdPromise = null;
const getSiteId = () => (siteIdPromise ||= gFetch(`/sites/${SP_HOST}:${SP_SITE_PATH}`).then(s => s.id));

const TOMT_DOK = () => ({ rev: "", updatedAt: 0, data: { hallar: {} } });

async function syncGet() {
  const siteId = await getSiteId();
  let meta;
  try {
    meta = await gFetch(`/sites/${siteId}/drive/root:/${DATAFIL}`);
  } catch (e) {
    if (e.status === 404) return TOMT_DOK();   // första gången: filen finns inte än
    throw e;
  }
  const token = await getToken();
  const r = await fetch(`${GRAPH}/sites/${siteId}/drive/items/${meta.id}/content`,
                        { headers: { Authorization: `Bearer ${token}` } });
  if (!r.ok) throw new Error("Innehåll " + r.status);
  return { rev: meta.eTag || "", updatedAt: Date.parse(meta.lastModifiedDateTime) || 0, data: await r.json() };
}

async function syncPut(data, baseRev) {
  const siteId = await getSiteId();

  // Utan baseRev vet vi inte vad vi skriver ovanpå. Finns filen redan är det en
  // krock att behandla som vilken annan — annars hade en tidig skrivning kunnat
  // radera någon annans arbete innan första pollen hunnit hem.
  if (!baseRev) {
    const nuvarande = await syncGet();
    if (nuvarande.updatedAt) return { conflict: true, ...nuvarande };
  }

  const token   = await getToken();
  const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
  if (baseRev) headers["if-match"] = baseRev;

  const r = await fetch(`${GRAPH}/sites/${siteId}/drive/root:/${DATAFIL}:/content`,
                        { method: "PUT", headers, body: JSON.stringify(data) });
  if (r.status === 412 || r.status === 409) return { conflict: true, ...(await syncGet()) };
  if (!r.ok) throw new Error("PUT " + r.status);

  const item = await r.json();
  return { rev: item.eTag || "", updatedAt: Date.parse(item.lastModifiedDateTime) || 0, data };
}

// Fältnivå-merge så två operatörer aldrig skriver över varandra. Tomma fält ger
// alltid vika för ifyllda; vid äkta krock avgör preferB (den "nyare" sidan).
const isEmptyVal = v => v === undefined || v === null || v === "";
function mergeVal(a, b, preferB) {
  if (isEmptyVal(a)) return isEmptyVal(b) ? "" : b;
  if (isEmptyVal(b)) return a;
  if (a === b) return a;
  return preferB ? b : a;
}
function mergeDay(a, b, preferB) {
  a = a || emptyDayData(); b = b || emptyDayData();
  const values = {};
  ALL_POINTS.forEach(p => { values[p.id] = mergeVal(a.values?.[p.id], b.values?.[p.id], preferB); });
  return { values, note: mergeVal(a.note, b.note, preferB) };
}
function mergeWeek(a, b, preferB) {
  const w = { weekNum: a.weekNum, year: a.year };
  DAY_KEYS.forEach(k => { w[k] = mergeDay(a[k], b[k], preferB); });
  return w;
}
function mergeWeeks(a = [], b = [], preferB) {
  const map = new Map();
  const key = w => `${w.year}-${w.weekNum}`;
  a.forEach(w => map.set(key(w), w));
  b.forEach(w => { const k = key(w); map.set(k, map.has(k) ? mergeWeek(map.get(k), w, preferB) : w); });
  return [...map.values()].sort((x, y) => (x.year - y.year) || (x.weekNum - y.weekNum));
}
function mergeSlab(a, b, preferB) {
  a = a || emptySlab(); b = b || emptySlab();
  const offsets = {};
  ALL_POINTS.forEach(p => { offsets[p.id] = mergeVal(a.offsets?.[p.id], b.offsets?.[p.id], preferB); });
  return { offsets, ref: mergeVal(a.ref, b.ref, preferB) };
}
// ── Anläggningar ──────────────────────────────────────────────────────────────
// Håll listan i takt med ANLAGGNINGAR_IS i index.html. Den dubbleras med flit:
// filerna delar inget bygge, och en delad modul hade krävt ett byggsteg som den
// här appen medvetet inte har.
const HALLAR = ["Nacka ishall", "Älta ishall", "Björknäs ishall", "Saltsjöbadens ishall"];
const STANDARDHALL = "Nacka ishall";

const tomHall  = () => ({ weeks: [], slab: emptySlab() });
const hallData = (d, h) => (d && d.hallar && d.hallar[h]) || tomHall();

// Nycklarna sorteras alltid, så att JSON-strängen av samma data blir identisk
// oavsett i vilken ordning hallarna råkade dyka upp. Annars hade appen trott att
// datat ändrats varje gång serverns och den lokala ordningen skilde sig, och
// skickat en onödig skrivning.
const sorteraHallar = h => Object.fromEntries(Object.keys(h).sort().map(k => [k, h[k]]));

// Datat var platt ({weeks, slab}) när appen bara kände en ishall. Gammal data
// lyfts in under Nacka ishall — det är den hall alla befintliga mätningar
// kommer från. Körs på både lokalt och hämtat data, så migreringen sker en gång
// av sig själv oavsett vilken väg datat kommer in.
function normalisera(d) {
  if (!d) return { hallar: {} };
  if (d.hallar) return { hallar: sorteraHallar(d.hallar) };
  if (d.weeks || d.slab) {
    return { hallar: { [STANDARDHALL]: { weeks: d.weeks || [], slab: d.slab || emptySlab() } } };
  }
  return { hallar: {} };
}

function mergeData(local, remote, preferRemote) {
  const l = normalisera(local), r = normalisera(remote);
  const hallar = {};
  [...new Set([...Object.keys(l.hallar), ...Object.keys(r.hallar)])].sort().forEach(h => {
    const a = l.hallar[h] || tomHall(), b = r.hallar[h] || tomHall();
    hallar[h] = {
      weeks: mergeWeeks(a.weeks, b.weeks, preferRemote),
      slab:  mergeSlab(a.slab, b.slab, preferRemote),
    };
  });
  return { hallar };
}

function App() {
  // All data för alla hallar i ett objekt. weeks och slab härleds ur vald hall,
  // så de fem anropsställena för setWeeks/setSlab kunde lämnas orörda.
  const [data, setData] = useState(() => {
    try {
      const nytt = localStorage.getItem("borrmall_data");
      if (nytt) return normalisera(JSON.parse(nytt));
      // Migrering från de gamla, platta nycklarna. De skrivs aldrig igen, men
      // lämnas kvar orörda som säkerhetskopia.
      const w = JSON.parse(localStorage.getItem("borrmall_weeks") || "[]");
      const sl = JSON.parse(localStorage.getItem("borrmall_slab") || "null");
      return normalisera({ weeks: w, slab: sl && sl.offsets ? sl : emptySlab() });
    } catch { return { hallar: {} }; }
  });
  const [hall, setHall] = useState(() => {
    try { return localStorage.getItem("borrmall_hall") || STANDARDHALL; } catch { return STANDARDHALL; }
  });

  const weeks = hallData(data, hall).weeks;
  const slab  = hallData(data, hall).slab;

  // Skriver tillbaka in i rätt hall. Tar både värde och uppdateringsfunktion,
  // precis som en vanlig setState, så anropsställena inte behövde ändras.
  const setIHall = useCallback((falt, upd) => setData(d => {
    const h = hallRef.current;
    const nuvarande = hallData(d, h);
    const nytt = typeof upd === "function" ? upd(nuvarande[falt]) : upd;
    return { hallar: sorteraHallar({ ...d.hallar, [h]: { ...nuvarande, [falt]: nytt } }) };
  }), []);
  const setWeeks = useCallback(upd => setIHall("weeks", upd), [setIHall]);
  const setSlab  = useCallback(upd => setIHall("slab",  upd), [setIHall]);
  const [currentWeekIdx, setCurrentWeekIdx] = useState(null);
  const [activeDay, setActiveDay] = useState("mon");
  const [selectedPoint, setSelectedPoint] = useState(null);
  const [view, setView] = useState("input");
  const [compareMode, setCompareMode] = useState(false);
  const [compareFrom, setCompareFrom] = useState(null);
  const [compareTo, setCompareTo] = useState(null);
  const touchStartX = useRef(null);
  const [sync, setSync] = useState({ status: "connecting", at: null });
  // Refs så synk-callbacks kan läsa senaste state utan att bytas ut varje render.
  const dataRef = useRef(data);          dataRef.current = data;
  const hallRef = useRef(hall);          hallRef.current = hall;
  const curIdxRef = useRef(currentWeekIdx);   curIdxRef.current = currentWeekIdx;
  const cmpFromRef = useRef(null);            cmpFromRef.current = compareFrom;
  const cmpToRef = useRef(null);              cmpToRef.current = compareTo;
  const revRef = useRef(0);          // serverns rev vi senast känner till (för baseRev)
  const appliedRef = useRef(-1);     // serverns updatedAt vi senast tillämpat
  const lastPushedRef = useRef("");  // JSON av data som matchar serverns baslinje
  const pushingRef = useRef(false);
  const VIEWS = ["input", "compare", "history"];
  const handleTouchStart = e => { touchStartX.current = e.touches[0].clientX; };
  const handleTouchEnd   = e => {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(dx) > 60) {
      const idx = VIEWS.indexOf(view);
      if (dx < 0 && idx < VIEWS.length - 1) setView(VIEWS[idx + 1]);
      if (dx > 0 && idx > 0)                setView(VIEWS[idx - 1]);
    }
    touchStartX.current = null;
  };

  useEffect(() => {
    try { localStorage.setItem("borrmall_data", JSON.stringify(data)); } catch {}
  }, [data]);

  useEffect(() => {
    try { localStorage.setItem("borrmall_hall", hall); } catch {}
  }, [hall]);

  // Tillämpa ett serverdokument: merga in i lokal data och remappa index. Stabil ([]).
  const applyRemote = useCallback((doc, preferRemote) => {
    const h        = hallRef.current;
    const oldWeeks = hallData(dataRef.current, h).weeks;
    const merged   = mergeData(dataRef.current, doc.data, preferRemote);
    const nyaWeeks = hallData(merged, h).weeks;
    const idOf = i => (i != null && oldWeeks[i]) ? oldWeeks[i] : null;
    const findIdx = w => w ? nyaWeeks.findIndex(x => x.weekNum === w.weekNum && x.year === w.year) : -1;

    revRef.current = doc.rev || 0;
    appliedRef.current = doc.updatedAt || 0;
    // Serverns baslinje, inte det mergade. Skiljer de sig har vi något eget att
    // skicka, och push-effekten upptäcker det på nästa render.
    lastPushedRef.current = JSON.stringify(normalisera(doc.data));

    setData(merged);
    // Behåll aktuell vecka / jämförelseval trots ev. omsortering.
    const ci = findIdx(idOf(curIdxRef.current)); if (ci >= 0) setCurrentWeekIdx(ci);
    const remap = (ref, setter) => {
      const r = ref.current; if (!r) return;
      const ni = findIdx(idOf(r.weekIdx));
      setter(ni >= 0 ? { weekIdx: ni, dayKey: r.dayKey } : null);
    };
    remap(cmpFromRef, setCompareFrom);
    remap(cmpToRef, setCompareTo);
  }, []);

  const doPush = useCallback(async (snapshot) => {
    if (pushingRef.current) return;
    pushingRef.current = true;
    try {
      setSync(s => ({ ...s, status: "syncing" }));
      const res = await syncPut(JSON.parse(snapshot), revRef.current);
      if (res.conflict) {
        applyRemote(res, false);           // serverns ändringar mergas, våra värden vinner krock; push-effekten skickar unionen igen
      } else {
        revRef.current = res.rev;
        appliedRef.current = res.updatedAt;
        lastPushedRef.current = snapshot;
        setSync({ status: "synced", at: Date.now() });
      }
    } catch (e) {
      setSync({ status: "offline", at: Date.now() });
    } finally { pushingRef.current = false; }
  }, [applyRemote]);

  // Hämta + poll: dra in andras ändringar.
  useEffect(() => {
    if (!SYNC_ENABLED) return;
    let alive = true;
    const pull = async () => {
      try {
        const doc = await syncGet();
        if (!alive) return;
        if ((doc.updatedAt || 0) !== appliedRef.current) applyRemote(doc, true);
        setSync(s => ({ status: "synced", at: Date.now() }));
      } catch (e) { if (alive) setSync({ status: "offline", at: Date.now() }); }
    };
    pull();
    const iv = setInterval(pull, POLL_MS);
    return () => { alive = false; clearInterval(iv); };
  }, [applyRemote]);

  // Skicka lokala ändringar (debouncad) när de avviker från serverns baslinje.
  const dataJson = useMemo(() => JSON.stringify(data), [data]);
  useEffect(() => {
    if (!SYNC_ENABLED) return;
    if (dataJson === lastPushedRef.current) return;
    const t = setTimeout(() => doPush(dataJson), 1200);
    return () => clearTimeout(t);
  }, [dataJson, doPush]);

  useEffect(() => {
    const now = new Date();
    const weekNum = getWeekNumber(now);
    const year = now.getFullYear();
    const idx = weeks.findIndex(w => w.weekNum === weekNum && w.year === year);
    if (idx >= 0) { setCurrentWeekIdx(idx); }
    else {
      const newWeek = { ...emptyWeek(), weekNum, year };
      setWeeks(prev => { const u = [...prev, newWeek]; setCurrentWeekIdx(u.length - 1); return u; });
    }
    // Jämförelseval pekar på veckoindex i den hall de valdes i och betyder inget
    // i en annan. Nollställs hellre än att peka på fel mätning.
    setCompareFrom(null);
    setCompareTo(null);
  }, [hall]);

  const currentWeek = currentWeekIdx !== null ? weeks[currentWeekIdx] : null;
  const updateDayData = (key, data) => setWeeks(prev => prev.map((w, i) => i === currentWeekIdx ? { ...w, [key]: data } : w));

  const navigateToWeek = useCallback((weekNum, year) => {
    const idx = weeks.findIndex(w => w.weekNum === weekNum && w.year === year);
    if (idx >= 0) {
      setCurrentWeekIdx(idx);
    } else {
      setWeeks(prev => {
        const newWeek = { ...emptyWeek(), weekNum, year };
        const u = [...prev, newWeek];
        setCurrentWeekIdx(u.length - 1);
        return u;
      });
    }
  }, [weeks]);
  const dayData = currentWeek?.[activeDay];

  const sessions = getAllSessions(weeks);
  const deltas = compareMode && compareFrom && compareTo
    ? computeDeltas(weeks[compareFrom.weekIdx]?.[compareFrom.dayKey], weeks[compareTo.weekIdx]?.[compareTo.dayKey])
    : null;
  const compareFromLabel = compareFrom ? (sessions.find(s => s.weekIdx === compareFrom.weekIdx && s.dayKey === compareFrom.dayKey)?.label || "") : "";
  const compareToLabel   = compareTo   ? (sessions.find(s => s.weekIdx === compareTo.weekIdx   && s.dayKey === compareTo.dayKey)?.label   || "") : "";
  const rinkDataForCompare = compareTo ? weeks[compareTo.weekIdx]?.[compareTo.dayKey] : dayData;

  const hasSlab = slabHasData(slab);
  const slabRef = resolveSlabRef(slab);
  const surface = useMemo(
    () => hasSlab ? computeSurface(dayData, slab.offsets, slabRef) : null,
    [dayData, slab, slabRef, hasSlab]
  );

  return (
    <div style={{ minHeight: "100vh", background: "#f0f4f8", color: "#1e293b", fontFamily: "'Inter','Segoe UI',sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        input[type=number] { -moz-appearance: textfield; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f0f4f8; }
        ::-webkit-scrollbar-thumb { background: #bfdbfe; border-radius: 2px; }
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(1.4); }
        }
      `}</style>

      {/* Header */}
      <div style={{ background: "#ffffff", borderBottom: "1px solid #d1ddf0", padding: "12px 16px",
        display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 100 }}>
        <div>
          <div style={{ fontSize: "11px", color: "#1d4ed8", textTransform: "uppercase", letterSpacing: "2px", marginBottom: "1px" }}>
            <a href="./" style={{ color: "#1d4ed8", textDecoration: "none", marginRight: "8px" }}>← Sportrond</a>
            Ishall · Istjocklek{SYNC_ENABLED && <SyncBadge sync={sync} />}
          </div>
          <div style={{ fontSize: "18px", fontWeight: "800", color: "#0f172a", letterSpacing: "-0.5px" }}>
            Borrmall
            {currentWeek && <WeekNav currentWeek={currentWeek} onNavigate={navigateToWeek} />}
          </div>
          <select value={hall} onChange={e => setHall(e.target.value)}
            style={{ marginTop: "4px", fontSize: "13px", fontWeight: 600, color: "#0f172a",
              border: "1px solid #d1ddf0", borderRadius: "6px", padding: "4px 6px",
              background: "#f8fafc", maxWidth: "210px" }}>
            {HALLAR.map(h => <option key={h} value={h}>{h}</option>)}
          </select>
        </div>
        <div style={{ display: "flex", gap: "6px", flexWrap: "wrap", justifyContent: "flex-end" }}>
          <TabBtn active={view === "input"}   onClick={() => setView("input")}>Mätning</TabBtn>
          <TabBtn active={view === "compare"} onClick={() => setView("compare")}>Jämförelse</TabBtn>
          <TabBtn active={view === "history"} onClick={() => setView("history")}>Historik</TabBtn>
          <TabBtn active={view === "calibration"} onClick={() => setView("calibration")}>Kalibrering</TabBtn>
        </div>
      </div>

      <div onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>

      {view === "compare" && <CompareView weeks={weeks} sessions={sessions} />}

      {view === "input" && (
        <div style={{ maxWidth: "640px", margin: "0 auto", padding: "16px" }}>
          {/* Day tabs */}
          <div style={{ display: "flex", gap: "6px", marginBottom: "16px" }}>
            {DAY_KEYS.map((key, i) => {
              const d = currentWeek?.[key];
              const filled = d ? Object.values(d.values).some(v => v !== "") : false;
              return (
                <button key={key} onClick={() => setActiveDay(key)} style={{
                  flex: 1, padding: "8px 4px", background: activeDay === key ? "#dbeafe" : "#ffffff",
                  border: `1px solid ${activeDay === key ? "#0284c7" : filled ? "#3b82f6" : "#d1ddf0"}`,
                  borderRadius: "8px", color: activeDay === key ? "#0f172a" : "#475569",
                  fontSize: "12px", fontWeight: activeDay === key ? "700" : "400",
                  cursor: "pointer", transition: "all 0.15s", position: "relative" }}>
                  {DAYS[i]}
                  {filled && <div style={{ position: "absolute", top: "3px", right: "4px", width: "5px", height: "5px", borderRadius: "50%", background: "#4ade80" }} />}
                </button>
              );
            })}
          </div>

          {/* Rink */}
          <div style={{ background: "#ffffff", borderRadius: "12px", border: "1px solid #d1ddf0", padding: "12px", marginBottom: "12px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px", position: "relative" }}>
              <div style={{ position: "absolute", left: 0, right: 0, textAlign: "center", fontSize: "11px", color: "#1d4ed8", textTransform: "uppercase", letterSpacing: "1px", pointerEvents: "none" }}>
                {compareMode ? "Jämförelsevy" : "Rinkvy — tryck på punkt för att välja"}
              </div>
              <div />
              <button onClick={() => setCompareMode(m => !m)} style={{
                fontSize: "11px", padding: "4px 10px", borderRadius: "6px",
                background: compareMode ? "#dbeafe" : "transparent",
                border: `1px solid ${compareMode ? "#0284c7" : "#d1ddf0"}`,
                color: compareMode ? "#0284c7" : "#475569", cursor: "pointer",
              }}>
                {compareMode ? "✕ Stäng" : "⇄ Jämför"}
              </button>
            </div>

            {compareMode && (
              <div style={{ display: "flex", gap: "8px", marginBottom: "10px" }}>
                {[{ label: "FRÅN", val: compareFrom, set: setCompareFrom }, { label: "TILL", val: compareTo, set: setCompareTo }].map(({ label, val, set }) => (
                  <div key={label} style={{ flex: 1 }}>
                    <div style={{ fontSize: "10px", color: "#475569", marginBottom: "3px" }}>{label}</div>
                    <select
                      value={val ? `${val.weekIdx}-${val.dayKey}` : ""}
                      onChange={e => {
                        if (!e.target.value) { set(null); return; }
                        const [wi, dk] = e.target.value.split("-");
                        set({ weekIdx: parseInt(wi), dayKey: dk });
                      }}
                      style={{ width: "100%", padding: "6px", background: "#f8fafc", border: "1px solid #d1ddf0", borderRadius: "6px", fontSize: "12px", color: "#1e293b" }}>
                      <option value="">Välj tillfälle…</option>
                      {sessions.map(s => (
                        <option key={`${s.weekIdx}-${s.dayKey}`} value={`${s.weekIdx}-${s.dayKey}`}>{s.label}</option>
                      ))}
                    </select>
                  </div>
                ))}
              </div>
            )}

            {compareMode ? (
              <>
                <RinkMap dayData={rinkDataForCompare} onSelect={() => {}} selectedPoint={null} deltas={deltas} />
                <DeltaLegend />
              </>
            ) : (
              <div style={{ display: "flex", flexWrap: "wrap", gap: "16px", alignItems: "flex-start", justifyContent: "center" }}>
                <div style={{ flex: "1 1 240px", minWidth: "200px" }}>
                  <div style={RINK_TITLE}>Istjocklek</div>
                  <RinkMap dayData={dayData} onSelect={setSelectedPoint} selectedPoint={selectedPoint} width="100%" />
                  <Legend />
                </div>
                <div style={{ flex: "1 1 240px", minWidth: "200px" }}>
                  <div style={RINK_TITLE}>Isjämnhet (tjocklek + platta)</div>
                  {surface ? (
                    <>
                      <RinkMap dayData={surface} onSelect={setSelectedPoint} selectedPoint={selectedPoint} width="100%" />
                      <Legend />
                    </>
                  ) : (
                    <LevelnessPlaceholder hasData={hasSlab} onCalibrate={() => setView("calibration")} />
                  )}
                </div>
              </div>
            )}
          </div>

          {compareMode && deltas && <DeltaPanel deltas={deltas} fromLabel={compareFromLabel} toLabel={compareToLabel} />}

          <div style={{ background: "#ffffff", borderRadius: "12px", border: "1px solid #d1ddf0", padding: "16px", marginTop: "16px" }}>
            <div style={{ fontSize: "12px", color: "#0f172a", fontWeight: "700", marginBottom: "12px" }}>Ange mätvärden (cm)</div>
            {dayData && (
              <InputGrid
                dayData={dayData}
                onChange={d => updateDayData(activeDay, d)}
                selectedPoint={selectedPoint}
                onSelect={setSelectedPoint}
              />
            )}
          </div>

          <button onClick={() => { if (confirm("Rensa alla värden för denna dag?")) updateDayData(activeDay, emptyDayData()); }}
            style={{ marginTop: "12px", padding: "8px 16px", background: "transparent", border: "1px solid #93c5fd", borderRadius: "6px", color: "#475569", fontSize: "12px", cursor: "pointer", width: "100%" }}>
            Rensa dag
          </button>
        </div>
      )}

      {view === "history" && (
        <div style={{ maxWidth: "640px", margin: "0 auto", padding: "16px" }}>
          <div style={{ fontSize: "13px", color: "#475569", marginBottom: "16px" }}>{weeks.length} veckor sparade</div>
          {[...weeks].reverse().map((week, ri) => {
            const idx = weeks.length - 1 - ri;
            return (
              <div key={idx} style={{ background: "#ffffff", border: `1px solid ${idx === currentWeekIdx ? "#0284c7" : "#d1ddf0"}`, borderRadius: "10px", padding: "14px", marginBottom: "10px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "10px" }}>
                  <div style={{ fontWeight: "700", fontSize: "14px" }}>
                    Vecka {week.weekNum}, {week.year}
                    {idx === currentWeekIdx && <span style={{ marginLeft: "8px", fontSize: "10px", color: "#0284c7", background: "#0a2a4a", padding: "2px 6px", borderRadius: "4px" }}>AKTUELL</span>}
                  </div>
                  <button onClick={() => { setCurrentWeekIdx(idx); setView("input"); }}
                    style={{ fontSize: "11px", color: "#0284c7", background: "transparent", border: "1px solid #1e4a7a", borderRadius: "4px", padding: "3px 8px", cursor: "pointer" }}>
                    Öppna
                  </button>
                </div>
                <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                  {DAY_KEYS.map((key, i) => {
                    const d = week[key];
                    const vs = Object.values(d.values).filter(v => v !== "").map(Number);
                    const avg = vs.length ? (vs.reduce((a, b) => a + b, 0) / vs.length).toFixed(1) : null;
                    return (
                      <div key={key} style={{ background: "#e8f0fb", borderRadius: "6px", padding: "6px 10px", minWidth: "60px", border: `1px solid ${avg ? getColor(avg) + "66" : "#d1ddf0"}` }}>
                        <div style={{ fontSize: "9px", color: "#475569", marginBottom: "2px" }}>{DAYS[i]}</div>
                        <div style={{ fontSize: "14px", fontWeight: "700", color: avg ? getColor(avg) : "#bfdbfe", fontFamily: "'DM Mono',monospace" }}>{avg ? avg + " cm" : "–"}</div>
                        <div style={{ fontSize: "8px", color: "#94a3b8" }}>{vs.length} pt</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
          {weeks.length === 0 && <div style={{ textAlign: "center", color: "#94a3b8", padding: "40px", fontSize: "14px" }}>Ingen historik än. Börja mäta!</div>}
        </div>
      )}

      {view === "calibration" && <CalibrationView slab={slab} refId={slabRef} onChange={setSlab} />}

      </div>
    </div>
  );
}


    function Inloggningskrav() {
      return (
        <div style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
          padding: "48px 24px", textAlign: "center", color: "#0f172a" }}>
          <div style={{ fontSize: "44px", marginBottom: "14px" }}>🧊</div>
          <h1 style={{ fontSize: "22px", margin: "0 0 8px" }}>Borrmall</h1>
          <p style={{ fontSize: "14px", color: "#475569", lineHeight: 1.5, maxWidth: "320px", margin: "0 auto 24px" }}>
            Du behöver vara inloggad med ditt Nacka-konto för att mätningarna ska
            kunna sparas. Logga in i Sportrond först — inloggningen gäller sedan
            för båda apparna.
          </p>
          <a href="./" style={{ display: "inline-block", background: "#1D9E75", color: "#fff",
            padding: "13px 22px", borderRadius: "10px", textDecoration: "none", fontWeight: 600 }}>
            Till Sportrond
          </a>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(ärInloggad() ? <App /> : <Inloggningskrav />);
  </script>
</body>
</html>
